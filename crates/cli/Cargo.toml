[package]
name = "ariadne-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[[bin]]
name = "tool"
path = "src/bin/tool.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-report = { path = "../report" }
ariadne-index = { path = "../index" }
ariadne-cluster = { path = "../cluster" }
ariadne-transform = { path = "../transform" }
ariadne-validate = { path = "../validate" }
ariadne-scheduler = { path = "../scheduler" }
ariadne-pipeline = { path = "../pipeline" }
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
ariadne-ui = { path = "../ui" }
# M18.3: lang-cpp is referenced only to enumerate `CppPlugin` in
# src/registry.rs (the single plugin enumeration site); no other CLI code
# touches a concrete plugin. Enumeration stays here by design — the core
# pipeline crates must stay plugin-free (plan §7 rule R2).
ariadne-lang-cpp = { path = "../lang-cpp" }
# M18.3: registry.rs is the single plugin enumeration site.
ariadne-lang = { path = "../lang" }
open = "5.1.2"
axum = { version = "0.7", features = ["tokio"] }
