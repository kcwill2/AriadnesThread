[package]
name = "ariadne-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[[bin]]
name = "tool"
path = "src/bin/tool.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-report = { path = "../report" }
ariadne-index = { path = "../index" }
ariadne-cluster = { path = "../cluster" }
ariadne-transform = { path = "../transform" }
ariadne-validate = { path = "../validate" }
ariadne-scheduler = { path = "../scheduler" }
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
ariadne-ui = { path = "../ui" }
open = "5.1.2"
axum = { version = "0.7", features = ["tokio"] }
