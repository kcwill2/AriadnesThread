[package]
name = "ariadne-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true

[[bin]]
name = "ariadne"
path = "src/main.rs"

[[bin]]
name = "tool"
path = "src/bin/tool.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-report = { path = "../report" }
ariadne-index = { path = "../index" }
ariadne-cluster = { path = "../cluster" }
ariadne-transform = { path = "../transform" }
ariadne-validate = { path = "../validate" }
ariadne-scheduler = { path = "../scheduler" }
ariadne-pipeline = { path = "../pipeline" }
bincode.workspace = true
serde.workspace = true
serde_json.workspace = true
ariadne-ui = { path = "../ui" }
# AR-19 (A1 part 2): the CLI production code no longer references any
# concrete language plugin -- planning consumes the AR-18 trait hooks through
# the registry (enumeration is pipeline-side per D9, and pipeline keeps its
# own lang-cpp/lang-scala deps, so the binaries still get both plugins).
# Both crates survive as DEV-dependencies below: cli's own unit tests and
# tests/payload_tail_bench.rs use the planning free functions as the
# byte-identity oracles the registry dispatch is locked against.
# M18.3: registry.rs is the single registry-facing seam.
ariadne-lang = { path = "../lang" }
open = "5.1.2"
axum = { version = "0.7", features = ["tokio"] }

[dev-dependencies]
tempfile.workspace = true
# AR-19: byte-identity oracles for the registry-dispatched planning hooks
# (src unit tests + tests/payload_tail_bench.rs); see the [dependencies] note.
ariadne-lang-cpp = { path = "../lang-cpp" }
ariadne-lang-scala = { path = "../lang-scala" }
# M28 T0c cap-0 ablation: the stage5_memory_bench release build links the
# pipeline with the cfg-gated caps-override route so
# ARIADNE_LOAD_MEM_CAPS reaches the bench children (the ui/graph
# duplicate-dev-dep feature pattern at `crates/ui/Cargo.toml:26`).
ariadne-pipeline = { path = "../pipeline", features = ["test-instrument"] }
