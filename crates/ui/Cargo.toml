[package]
name = "ariadne-ui"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
axum.workspace = true
tower-http.workspace = true
regex = "1.10"
rayon = { workspace = true }
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-index = { path = "../index" }
ariadne-report = { path = "../report" }

[dev-dependencies]
tempfile.workspace = true
tower = { version = "0.4", features = ["util"] }
# C1 memo-reuse route locks read the LoadMemo instrumentation counters.
ariadne-graph = { path = "../graph", features = ["test-instrument"] }
