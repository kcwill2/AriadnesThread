[package]
name = "ariadne-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true

[features]
# M28 T0c ablation lever: chains the graph LoadMemo counters so the
# feature-gated route tests in `stage_load_tests.rs` can assert cache
# lengths, and exposes the cfg-gated caps-override route. Production and
# plain-test builds never enable it (ui graph test-instrument precedent,
# `crates/ui/Cargo.toml:26`).
test-instrument = ["ariadne-graph/test-instrument"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rayon.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-index = { path = "../index" }
ariadne-report = { path = "../report" }
ariadne-scheduler = { path = "../scheduler" }
# M18.4: C++ unit shaping default until registry injection (M18.3/M18.5).
ariadne-lang-cpp = { path = "../lang-cpp" }
# D9 (M19.3): build_default_registry is the single plugin enumeration site;
# pipeline owns the builder because cli depends on pipeline, never the
# reverse (cycle rule), so cli delegates here.
ariadne-lang-scala = { path = "../lang-scala" }
# rust-language R-4 (registration hop): build_default_registry appends the
# Rust plugin LAST. The dependency edge is the mechanical half of shape
# sec. 3.2's one line (journal deviation 1: the handoff touch-set named the
# src file only; the line cannot compile without this edge - M19.3's Scala
# registration left the same manifest precedent).
ariadne-lang-rust = { path = "../lang-rust" }
# M18.3: registry-driven index stage (LanguageRegistry/LanguagePlugin).
ariadne-lang = { path = "../lang" }

[dev-dependencies]
tempfile.workspace = true
