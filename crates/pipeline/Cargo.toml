[package]
name = "ariadne-pipeline"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
rayon.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-graph = { path = "../graph" }
ariadne-index = { path = "../index" }
ariadne-report = { path = "../report" }
ariadne-scheduler = { path = "../scheduler" }
# M18.4: C++ unit shaping default until registry injection (M18.3/M18.5).
ariadne-lang-cpp = { path = "../lang-cpp" }
# D9 (M19.3): build_default_registry is the single plugin enumeration site;
# pipeline owns the builder because cli depends on pipeline, never the
# reverse (cycle rule), so cli delegates here.
ariadne-lang-scala = { path = "../lang-scala" }
# M18.3: registry-driven index stage (LanguageRegistry/LanguagePlugin).
ariadne-lang = { path = "../lang" }

[dev-dependencies]
tempfile.workspace = true
