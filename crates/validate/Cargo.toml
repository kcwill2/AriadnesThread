[package]
name = "ariadne-validate"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
bincode.workspace = true
tempfile.workspace = true
ariadne-transform = { path = "../transform" }
ariadne-cluster = { path = "../cluster" }
# M18.8b: apply_with takes the neutral DependencyRewriter hook.
ariadne-lang = { path = "../lang" }

[dev-dependencies]
# Byte-parity locks run apply_with against the C++ plugin's directive text;
# production code stays plugin-free (same pattern as ariadne-transform).
ariadne-lang-cpp = { path = "../lang-cpp" }
