[package]
name = "ariadne-lang-cpp"
version.workspace = true
edition.workspace = true
authors.workspace = true

# Plugin crate (plan §3.1): depends inward only. Deliberately NOT depended on:
# ariadne-graph / ariadne-cluster / ariadne-transform / ariadne-validate
# (enforced by the m17 architecture guard). The Include-graph DTOs the
# resolver speaks live in ariadne-lang-api.
# AR-20 note: the backend implements ariadne_worker_core::WorkerBackend
# over ariadne_worker_core::TuTask and calls the closure-merge engine
# (ariadne_worker_core::tu_store) directly - the worker-core dep is why
# the m17 transitive guard cone stays free of scheduler/report/cluster/
# graph/transform/validate. Acyclic: worker-core never depends on any
# plugin crate outside its own dev-deps (see crates/build/Cargo.toml).
# AR-21 test-only feature: compiles the deprecated legacy `IncludeResolver`
# oracle surface (resolver.rs + lib.rs re-export). Enabled ONLY by the
# dev-dependency wiring in tests/integration/Cargo.toml for the
# m18_cpp_plugin_parity suites; production consumers (pipeline,
# clang-worker, tool) never enable it and compile the legacy resolver out.
[features]
test-resolver = []

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-lang-api = { path = "../lang-api" }
ariadne-lang = { path = "../lang" }
ariadne-worker-core = { path = "../worker-core" }

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
