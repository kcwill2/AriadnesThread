[package]
name = "ariadne-build"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
bincode.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-lang-api = { path = "../lang-api" }
ariadne-lang = { path = "../lang" }

[dev-dependencies]
tempfile.workspace = true
# M18.4: the discovery unit tests exercise the neutral shaper seam with the
# real C++ shaper. This dev-dependencies edge exists only for those tests;
# production code in this crate stays plugin-free (lang-cpp depends on
# ariadne-build normally, so a build -> lang-cpp edge must stay dev-only).
ariadne-lang-cpp = { path = "../lang-cpp" }
