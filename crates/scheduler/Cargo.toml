[package]
name = "ariadne-scheduler"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
ariadne-repo = { path = "../repo" }
ariadne-build = { path = "../build" }
ariadne-index = { path = "../index" }
ariadne-graph = { path = "../graph" }
ariadne-report = { path = "../report" }
ariadne-lang = { path = "../lang" }
# AR-20a: the tu_store engine + worker vocabulary live in the neutral
# ariadne-worker-core crate; scheduler re-exports them (see src/lib.rs).
ariadne-worker-core = { path = "../worker-core" }

[dev-dependencies]
tempfile.workspace = true
# The canonical closure/merge tests run the C++ plugin through the registry
# seam (production code stays plugin-free). The dev edge back into lang-cpp
# is allowed by cargo (test-only), and lang-cpp's normal `scheduler` dep
# (M18.11 ClangWorkerBackend relocation) never sees this crate's test build.
ariadne-lang-cpp = { path = "../lang-cpp" }
