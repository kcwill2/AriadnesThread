[workspace]
members = [
    "crates/cli",
    "crates/lang",
    "crates/lang-api",
    "crates/lang-cpp",
    "crates/lang-scala",
    "crates/repo",
    "crates/build",
    "crates/worker-core",
    "crates/scheduler",
    "crates/index",
    "crates/graph",
    "crates/cluster",
    "crates/transform",
    "crates/validate",
    "crates/report",
    "crates/pipeline",
    "tools/clang-worker",
    "tests/integration",
    "crates/ui",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AriadnesThread Authors"]

[workspace.dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.35", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.9"
sha2 = "0.10"
bincode = "1.3"
axum = { version = "0.7", features = ["json", "query"] }
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1"

[profile.release]
# AriadnesThread: keep integer underflow LOUD in release. Two incidents
# (M25 parser.rs brace-depth, M27 tokenizer char/byte columns) both
# silent-wrapped in release; debug already checks (M27 T0 proof).
# Cost measured at T5: see tasks/tu-index-hang-throughput-t1-measurement.md sec. (e).
overflow-checks = true
