<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF2A54" />
      <stop offset="100%" stop-color="#FF9B26" />
    </linearGradient>
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background Container -->
  <rect width="256" height="256" rx="48" fill="#0A0F1D"/>

  <!-- Background code/grid hints -->
  <path d="M40,128 L216,128 M128,40 L128,216" stroke="#1A253D" stroke-width="2" stroke-dasharray="4 4" fill="none"/>

  <!-- Digital Network Tracks (The Labyrinth) -->
  <g stroke="#324469" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M120,80 L180,80 L180,50" />
    <path d="M120,112 L200,112" />
    <path d="M120,144 L170,144 L170,180" />
    <path d="M120,176 L160,176 L160,210" />
  </g>

  <!-- Inactive Network Nodes -->
  <g fill="#4F6D9F">
    <circle cx="180" cy="50" r="5" />
    <circle cx="200" cy="112" r="5" />
    <circle cx="170" cy="180" r="5" />
    <circle cx="160" cy="210" r="5" />
  </g>

  <!-- Ariadne's Thread (The solving path/knot) -->
  <g stroke="url(#neonGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#neonGlow)">
    <!-- Complex knot loop -->
    <path d="M30,128 L60,128 C 80,128 70,90 100,90 C 120,90 110,128 130,128 C 150,128 150,80 190,80" />
    <!-- Branches of the thread tracing dependencies -->
    <path d="M100,90 L120,112 L190,112" />
    <path d="M85,115 L110,144 L170,144" />
    <path d="M95,138 L120,176 L150,176" />
  </g>

  <!-- Active Thread Nodes ( glowing ) -->
  <g fill="#FF6B3D" filter="url(#neonGlow)">
    <circle cx="190" cy="80" r="6" />
    <circle cx="190" cy="112" r="6" />
    <circle cx="170" cy="144" r="6" />
    <circle cx="150" cy="176" r="6" />
  </g>
</svg>
