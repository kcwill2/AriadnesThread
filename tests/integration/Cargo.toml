[package]
name = "ariadne-integration-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
anyhow.workspace = true
tempfile.workspace = true
serde_json.workspace = true
ariadne-repo = { path = "../../crates/repo" }
ariadne-build = { path = "../../crates/build" }
ariadne-graph = { path = "../../crates/graph" }
ariadne-cli = { path = "../../crates/cli" }
ariadne-report = { path = "../../crates/report" }
ariadne-index = { path = "../../crates/index" }
ariadne-scheduler = { path = "../../crates/scheduler" }
ariadne-pipeline = { path = "../../crates/pipeline" }
ariadne-cluster = { path = "../../crates/cluster" }
ariadne-transform = { path = "../../crates/transform" }
ariadne-validate = { path = "../../crates/validate" }
sha2.workspace = true
serde.workspace = true
tokio.workspace = true
ariadne-ui = { path = "../../crates/ui" }
reqwest = { version = "0.12", features = ["blocking", "json"] }

[dev-dependencies]
ariadne-lang-api = { path = "../../crates/lang-api" }
ariadne-lang = { path = "../../crates/lang" }
# M18.4: fingerprint helpers must inject the same C++ shaper the pipeline does.
# AR-21 D1: the m18 parity binary drives its legacy side through the
# test-gated `ariadne_lang_cpp::IncludeResolver` (see crates/lang-cpp
# Cargo.toml [features]); this dev-dep edge is the single feature-wiring
# site (a tests-only package; production builds never see the feature).
ariadne-lang-cpp = { path = "../../crates/lang-cpp", features = ["test-resolver"] }
# M19.3: the m19 discovery suite asserts the Scala plugin contract end to end.
ariadne-lang-scala = { path = "../../crates/lang-scala" }
